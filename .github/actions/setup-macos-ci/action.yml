name: Setup macOS CI
description: Select the repo Xcode toolchain and optionally install Homebrew tools.

inputs:
  install-homebrew-tools:
    description: Install repo tooling from Brewfile when true.
    required: false
    default: "true"
  brewfile-path:
    description: Path to the repo Brewfile.
    required: false
    default: Brewfile

runs:
  using: composite
  steps:
    - name: Select Xcode 27.0
      shell: bash
      run: |
        set -euo pipefail
        XCODE_APP=/Applications/Xcode_27.0.app
        if [ ! -d "$XCODE_APP" ]; then
          echo "Required stable Xcode 27.0 is missing at $XCODE_APP" >&2
          exit 1
        fi
        sudo xcode-select -s "$XCODE_APP/Contents/Developer"
        xcodebuild -version
        xcrun swift --version
        test "$(xcodebuild -version | head -1)" = "Xcode 27.0"
        xcrun swift --version | grep -Eq 'Apple Swift version 6\.4([ .]|$)'

    - name: Install Homebrew tools
      if: ${{ inputs.install-homebrew-tools == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        brew update
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew bundle install --file "${{ github.workspace }}/${{ inputs.brewfile-path }}"
        "${{ github.workspace }}/scripts/ci/check-tool-versions.sh"
